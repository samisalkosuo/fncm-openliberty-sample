<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FileNet App</title>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>
<div id="app">
  <app-header app-name="FNCM OpenLiberty Sample"></app-header>

  <main>
    <!-- ── Login view ── -->
    <div id="view-login" class="view active">
      <div class="card" style="max-width:380px;margin:3rem auto;">
        <h2>Sign in</h2>
        <div id="login-alert" class="alert alert-error hidden"></div>
        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <input id="username" type="text" autocomplete="username" required/>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" required/>
          </div>
          <button type="submit" id="login-btn">Sign in</button>
        </form>
      </div>
    </div>

    <!-- ── App view (shown after login) ── -->
    <!--
      HOW TO ADD A NEW CARD:
        1. Copy js/cards/_template.js → js/cards/myFeature.js
        2. Add one import line in js/main.js — that's it.
      index.html does not need to be changed.
    -->
    <div id="view-app" class="view">
      <div class="card-grid">
        <!-- cards are injected here by js/cards/registry.js at runtime -->
      </div><!-- /card-grid -->
    </div><!-- /view-app -->
  </main>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
