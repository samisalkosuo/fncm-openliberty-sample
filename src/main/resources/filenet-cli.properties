# FileNet Configuration File
# Environment variables will override these settings

   
# FileNet Content Engine URL
# Example: https://server.example.com/wsi/FNCEWS40MTOM/
filenet.url=https://server.example.com/cpe/wsi/FNCEWS40MTOM/

filenet.iamhost=https://cp-console.server.example.com
filenet.cp4bahost=https://server.example.com

# FileNet Domain
filenet.domain=P8DOMAIN

# Object Store name
filenet.objectstore=OS01

# Username for authentication
filenet.username=username

# Password for authentication
# WARNING: Storing passwords in plain text is not secure
# Consider using environment variables instead (FILENET_PASSWORD in container)
filenet.password=password

# Authentication stanza (optional, defaults to FileNetP8WSI)
filenet.stanza=FileNetP8WSI