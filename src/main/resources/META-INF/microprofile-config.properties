# CP4BA auth
iam.host=${FILENET_IAMHOST}
cp4ba.host=${FILENET_CP4BAHOST}

# FileNet credentials
filenet.username=${FILENET_USERNAME}
filenet.password=${FILENET_PASSWORD}

# FileNet CPE
filenet.cpe.url=${FILENET_URL}
filenet.domain=${FILENET_DOMAIN}
filenet.objectstore=${FILENET_OBJECTSTORE}
filenet.stanza=${FILENET_STANZA}

# GraphQL
graphql.url=${FILENET_GRAPHQL_URL}

# TLS (set false only in dev/test)
tls.certificate.verification.enabled=${TLS_CERTIFICATE_VERIFICATION_ENABLED:false}

# Token TTL
token.ttl.seconds=3600
